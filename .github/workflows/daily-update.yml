name: Daily Reference Update

on:
  schedule:
    # 07:10 Asia/Seoul. GitHub often delays cron by 1-2h; a second trigger at 11:10 KST
    # is a safety net. Every step is idempotent, so a second run is cheap.
    - cron: "10 22 * * *"
    - cron: "10 2 * * *"
  workflow_dispatch:
    inputs:
      backfill_budget:
        description: "Extra backfill batches for the deep reader (8 items each)"
        default: "120"

permissions:
  contents: write

concurrency:
  group: daily-reference-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_EMBED_KEYS: ${{ secrets.GEMINI_EMBED_KEYS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      # The collector self-heals: on a failed verify it restores the pre-run snapshot,
      # so continuing is safe. A bad collection day must not block reading/publishing.
      - name: Collect today's references (mechanical layer)
        id: collect
        continue-on-error: true
        run: npm run recover:daily

      - name: Remove cross-date duplicates
        run: node scripts/dedupe-archives.mjs

      - name: Commit collected references first
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Collect references [$(date -u +%Y-%m-%d)]"

      - name: Deep reading (grounded LLM insight per item)
        continue-on-error: true
        run: node scripts/deep-insight-agent.mjs --daily-budget=90 --backfill-budget=${{ github.event.inputs.backfill_budget || '120' }} --daily-days=3 --batch=8 --concurrency=4

      - name: Signal hypotheses (cross-item trends)
        continue-on-error: true
        run: node scripts/signal-agent.mjs --days=14

      - name: Semantic search index (incremental)
        continue-on-error: true
        run: node scripts/search-index-agent.mjs --max=3000

      - name: Export site data
        run: npm run export:archive

      - name: Publish guard (refuse broken or shrinking data)
        run: node scripts/verify-site-data.mjs

      - name: Commit and push
        run: |
          git add data public
          if git diff --cached --quiet; then
            echo "No further changes."
          else
            git commit -m "Automated daily update [$(date -u +%Y-%m-%d)]"
          fi
          git pull --rebase origin main || true
          git push

      - name: Report collection failure
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::warning::recover:daily failed today; archives were restored from snapshot and the run continued with existing data. Check data/recovery-history.json."
