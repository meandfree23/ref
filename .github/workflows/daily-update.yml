name: Daily Reference Update

on:
  schedule:
    # 07:10 Asia/Seoul (UTC+9) every day
    - cron: "10 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-reference-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run daily recovery and update
        run: npm run recover:daily

      - name: Re-export static archive
        run: npm run export:archive

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data public
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Automated daily update [$(date -u +%Y-%m-%d)]"
            git push
          fi
