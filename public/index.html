<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reference Selector</title>
    <meta name="description" content="광고 감독을 위한 레퍼런스 리서치 아카이브. 매일 원문을 읽고 날카로운 관찰만 남깁니다." />
    <link rel="stylesheet" href="./styles.css?v=2" />
  </head>
  <body>
    <main class="app-shell">
      <header class="masthead">
        <div class="masthead-brand">
          <p class="eyebrow">References · Ideas · Culture</p>
          <h1>Reference Selector</h1>
          <p class="masthead-note" id="mastheadNote">원문을 읽고 판독한 레퍼런스 아카이브</p>
        </div>
        <form class="masthead-search" id="briefForm" role="search">
          <label for="briefInput">브리프로 찾기</label>
          <div class="masthead-search-row">
            <input id="briefInput" type="search" placeholder="예: 20대 여성 타깃 핀테크 광고, 손으로 만든 질감과 빠른 편집" autocomplete="off" />
            <button type="submit" class="btn btn-ink">검색</button>
          </div>
        </form>
      </header>

      <nav class="view-tabs" aria-label="리서치 보기">
        <button class="view-tab is-active" type="button" data-view="today">오늘의 픽</button>
        <button class="view-tab" type="button" data-view="updates">업데이트</button>
        <button class="view-tab" type="button" data-view="korean-code">Korean Code</button>
        <button class="view-tab" type="button" data-view="cinema">Cinema</button>
        <button class="view-tab" type="button" data-view="signals">시그널</button>
        <button class="view-tab" type="button" data-view="brief">브리프 검색</button>
        <button class="view-tab" type="button" data-view="board">내 보드</button>
        <button class="view-tab view-tab--quiet" type="button" data-view="curator">큐레이터</button>
      </nav>

      <section class="filter-bar" id="filterBar" hidden>
        <div class="filter-strip" id="categoryChips"></div>
        <div class="filter-side">
          <label class="filter-search"><input id="localFilter" type="search" placeholder="아카이브 안에서 바로 찾기" /></label>
          <select id="dateSelect" class="filter-select" aria-label="날짜"></select>
          <button class="chip chip-toggle" id="toggleAll" type="button" aria-pressed="false">접힌 항목 보기</button>
        </div>
      </section>

      <section class="panel" id="panel" aria-live="polite"></section>

      <footer class="site-foot">
        <span id="footMeta"></span>
        <span>ref-smoky.vercel.app · 매일 07:10 KST 자동 판독</span>
      </footer>
    </main>
    <script src="./app.js?v=2"></script>
  </body>
</html>
